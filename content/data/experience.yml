  summary: Designed and implemented a 4-stage Multi-Agent scraping pipeline covering 1,600+ libraries, museums, and arts centers across Pennsylvania.
  summary_zh: 设计并实现了一个四阶段多智能体抓取管线，覆盖宾夕法尼亚州1,600余家图书馆、博物馆和艺术中心。
  details:
    - "Designed and implemented a 4-stage Multi-Agent scraping pipeline (OSM venue discovery → homepage navigation → event-page extraction → Perplexity fallback) covering 1,600+ libraries, museums, and arts centers across Pennsylvania to automatically collect event time, location, and type data."
    - "Built a SQLite-backed adaptive memory system maintaining an independent Playbook per venue (known event-page URLs, scraping strategies, failure logs), combined with EMA quality feedback and a priority-scheduling algorithm (days overdue × yield × venue weight) enabling continuous self-optimization without human intervention."
    - "Developed a rule-engine Judge Agent to score (0–1) and adjudicate (accept / review / reject) extraction results, and built a knowledge-graph module supporting cross-venue programming-profile analysis and similar-venue discovery via regex tag extraction and Jaccard similarity."
  details_zh:
    - "设计并实现四阶段多智能体抓取管线（OSM场馆发现 → 主页导航 → 活动页面抽取 → Perplexity兜底），覆盖宾夕法尼亚州1,600余家图书馆、博物馆和艺术中心，自动采集活动时间、地点与类型数据。"
    - "构建基于SQLite的自适应记忆系统，为每家场馆维护独立Playbook（已知活动页面URL、抓取策略、失败日志），结合EMA质量反馈与优先级调度算法（逾期天数 × 产出率 × 场馆权重），实现无需人工干预的持续自优化。"
    - "开发规则引擎裁判智能体，对抽取结果进行0–1评分并作出接受/审核/拒绝裁定；构建知识图谱模块，通过正则标签抽取与Jaccard相似度支持跨场馆编程画像分析与相似场馆发现。"
  tags:
    - Multi-Agent Systems
    - Web Scraping
    - SQLite
    - Urban Events

- city: Copenhagen
  region: Denmark
  institution: Henning Larsen
  role: Data Classification System for Architectural Practice
  role_zh: 建筑实践数据分类系统
  section: Experience
  category: Research Practice
  period: 2026.01 - Present
  latitude: 55.6761
  longitude: 12.5683
  summary: Designed and deployed an AI pipeline to fully automate classification of 500+ unstructured architectural documents from large-scale urban planning projects.
  summary_zh: 设计并部署了一个AI管线，实现500余份大型城市规划项目非结构化建筑文档的全自动分类。
  details:
    - "Designed and deployed a 4-layer LLM classification pipeline (routing extraction → 7-dimensional classification → design-influence scoring → risk review) to fully automate classification of 500+ unstructured architectural documents from large-scale urban planning projects such as Faelledby."
    - "Implemented two RAG modes: folder-sibling RAG for context recall from adjacent files, and project intelligence RAG for extracting open design decisions from meeting minutes, enhancing project-context awareness."
    - Designed a dynamic VLM Agent Gate that automatically determines whether to activate the vision model based on pre-screening signals, reducing unnecessary API calls while maintaining accuracy.
    - "Built a design-influence scoring model (0–100) using a 4-dimensional geometric mean covering constraint rigidity, decision-chain position, phase alignment, and substitutability, quantifying each document's strategic impact on active design decisions to drive Review Queue prioritization."
    - "Integrated multiple LLMs/VLMs via OpenRouter with 10-way parallel processing; supports incremental mode and conditional selective re-runs for production efficiency and iteration flexibility."
  details_zh:
    - "设计并部署四层LLM分类管线（路由抽取 → 七维分类 → 设计影响力评分 → 风险审查），全自动处理Faelledby等大型城市规划项目中500余份非结构化建筑文档。"
    - "实现两种RAG模式：同文件夹邻近文件上下文召回RAG，以及从会议纪要中提取开放设计决策的项目智能RAG，提升项目上下文感知能力。"
    - "设计动态VLM智能体门控，根据预筛信号自动决定是否激活视觉模型，在保持精度的同时减少不必要的API调用。"
    - "构建设计影响力评分模型（0–100），采用涵盖约束刚性、决策链位置、阶段对齐度和可替代性的四维几何均值，量化每份文档对当前活跃设计决策的战略影响，驱动审查队列优先级排序。"
    - "通过OpenRouter集成多款LLM/VLM，支持10路并行处理；支持增量模式与条件性选择性重跑，兼顾生产效率与迭代灵活性。"
  tags:
    - LLM Pipeline
    - RAG
    - VLM
    - OpenRouter
    - Data Taxonomy

