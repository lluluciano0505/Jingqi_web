intro_title: Applied AI & Data Workflow Builder
intro_title_zh: 应用 AI 与 Agent 工作流实践者
intro_text: |
  I'm Jingqi Lu, a 2026 M.S. graduate in Urban Spatial Analytics at the University of Pennsylvania (GPA 3.93), currently based in Shanghai. I use LLMs and agent workflows as practical production tools rather than leaving them as abstract research topics.

  In practice, I apply them in two directions: large-scale information collection and structuring that manual teams cannot cover efficiently, and AI-assisted quality-control loops embedded in day-to-day delivery.

  I've shipped that approach across industrial data, urban research, and architectural practice. I'm currently working in industrial data operations while building applied AI systems for messy, high-volume knowledge workflows.
intro_text_zh: |
  我是卢璟琦，宾夕法尼亚大学城市空间分析理学硕士（2026 届，GPA 3.93），目前在上海工作。我把大模型与 Agent 工作流当作日常生产力工具使用，而不是停留在概念层面。

  一方面，我用它完成人力难以覆盖的信息采集、整理与结构化；另一方面，也把它嵌入日常质检流程，用来辅助判断、减少重复劳动，并稳定交付质量。

  这些方法已经在工业数据、城市研究与建筑设计三类场景中实际落地。当前关注应用 AI、数据工作流、智能体系统编排，以及面向真实业务的生产化质量控制。
